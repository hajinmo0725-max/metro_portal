    name: 양원역
    lat: 37.6066
    lon: 127.108
    reason: "표준데이터 좌표(36.96, 129.09)가 경북 봉화의 영동선 양원역 위치. 인접역 망우·구리와 190km 이상 벌어짐"
  - id: "kr:S1105:0514"
    name: 마곡
    lat: 37.562182
    lon: 126.82693
    reason: "표준데이터 좌표가 인접역 발산과 7m 차이 (발산 좌표 복사로 보임)"
  - id: "kr:I1104:0430"
    name: 이촌(국립중앙박물관)
    lat: 37.522525
    lon: 126.97335
    reason: "표준데이터 좌표가 인접역 신용산과 14m 차이 (신용산 좌표 복사로 보임)"
  - id: "kr:I26K6:8005"
    name: 동래역 (동해선)
    lat: 35.1976
    lon: 129.09
    reason: >-
      2026-11-05 N3. 표준데이터 좌표가 부산 4호선 동래(kr:L2604:0402)와 7m 차이 (좌표 복사 패턴, 마곡·이촌과 같음).
      Wikidata Q1234185 '동래역 (한국철도공사)' P625는 1.4km 동남쪽(4호선 낙민역에서 303m)이고, 이 좌표면 동해선 이웃
      교대 1037m·안락 1021m로 노선이 매끄럽다(기존 좌표는 교대 1230m·안락 2362m로 북서쪽으로 튀어나옴).
      독립 근거 2개(Wikidata 좌표, 이웃역 기하) 일치로 보정. Wikidata 원문이 Point(129.09 35.1976)라 경도 정밀도가
      0.01°(약 ±450m)다. 결과: 동해선 동래가 1·4호선 동래와 별도 클러스터가 되고 같은 도시 T1 포탈 '동래'가 생긴다.
      사용자 확인 필요.

