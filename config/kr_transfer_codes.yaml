# 노선 패밀리: 같은 운행 노선인데 표준데이터에서 노선번호가 갈라진 묶음.
# (1) 공식 환승노선 목록은 패밀리로 넓혀 비교한다 — 1호선 신설동이 '2호선'을 S1102(본선)로 적었는데 우리 2호선 신설동 레코드는 S1121(성수지선).
# (2) 같은 패밀리 두 레코드(직결 경계: 3호선↔일산선 지축, 같은 I4108의 경의중앙선/경춘선 그룹 등)는 '환승'이 아니라
