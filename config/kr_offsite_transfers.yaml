# 4차 Q6-3: 역외 환승 수동 목록 (데이터 큐레이션). ruleset의 cluster.offsite_transfers가 이 파일을 가리키면 쓴다.
#
# 원칙 (2026-11-06 사용자 결정): 포탈은 "현실에서 불가능한 이동"이어야 한다. 연결 통로가 없어도 역 밖으로 나와
# 교통카드로 갈아타는 역외 환승이면 현실에서 가능한 이동이라 같은 클러스터(환승)로 묶는다.
# 표준데이터 환승역구분 '일반역'은 역내 환승이 없다는 뜻일 뿐 역외 환승 정보는 담지 않는다 → 공식 정보가 no여도 이 목록이 이긴다.
#
# 적용 범위: 정규화 이름이 같은 역 레코드 쌍만 (graph.build_clusters의 같은 이름 쌍 판정에서 덮어쓴다).
# 거리 상한은 ruleset의 official_max_distance_m을 그대로 쓴다.
