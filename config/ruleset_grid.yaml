# N4 ruleset 비교 실험 격자. pipeline/09_compare_rulesets.py가 읽는다.
# base ruleset 위에 overrides를 deep merge 해서 조합별 그래프를 만든다 (ruleset.load_ruleset overrides).
# 매칭 룰 값은 여기와 config/rulesets/*.yaml에만 둔다 (CLAUDE.md).
base: strict
# 비교 기준 조합 (포탈 목록 차이를 이 조합 대비로 보여 준다)
reference: {transfer: 0, D: 500}
axes:
  transfer: [0, 1]       # costs.transfer
  D: [300, 500, 1000]    # cluster.transfer_distance_m
