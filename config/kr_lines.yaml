# 한국 노선 정의와 정차 순서 보정.
#
# 기본값: 레일포털 표준데이터 노선정보의 '정거장구성' 순서를 그대로 쓴다.
# 여기 적힌 항목만 보정한다. 매칭 룰이 아니라 원본 데이터의 누락·순서 오류를 고치는 데이터 큐레이션이다.
#
# source: 원본 노선정보의 {line_no: 노선번호, name: 노선명(공백 정리)} — 이 키로 원본 행과 짝짓는다
# pools:  정차역 이름을 찾을 역 그룹(stations.json의 line_group). 생략하면 노선번호가 같은 그룹 전부
# patch:  원본 순서에 대한 수정 — remove, insert_after{기준역: [...]}, prepend, append (적용 순서도 이 순서)
# branches / sequences: 지선은 별도 시퀀스로 분리 (DESIGN 4장)
# "역명@그룹" 표기는 다른 노선 그룹의 역을 가리킨다 (직결 분기점 연결용)
#
# 보정 근거는 M2 검증 리포트(docs/reports/m2_lines_validation.md)의 매칭 실패·미편입 역·거리 이상치다.
# 실제 노선 구조는 작성자 지식 기반이며 공식 자료로 대조하지 않았다 (검증 못 함 → 보고서 질문 목록).

lines:
  # ---------------- 서울·수도권 ----------------
  - source: {line_no: I4101, name: 수도권 광역철도 1호선}
    id: seoul-1
    name: 1호선 (서울역~청량리)
    city: 수도권
    color: "#0052A4"
    pools: ["I4101:1호선"]

  - source: {line_no: I4101, name: 경부선}
    id: seoul-1-gyeongbu
    name: 1호선 경부선
    city: 수도권
    color: "#0052A4"
    pools: ["I4101:경부선", "I4401:경부선", "I4401:장항선"]
    patch:
      # 원본은 광명(셔틀)·서동탄(병점기지선)을 본선 중간에 끼워 넣었다 → 지선으로 분리
      # 경부선 역 그룹에는 서울역 행이 없다 → 1호선 그룹의 서울역에서 출발
      remove: [광명역, 서동탄역, 서울역]
      prepend: ["서울역@I4101:1호선"]
    branches:
      - id: gwangmyeong
        stops: [금천구청역, 광명역]
      - id: seodongtan
        stops: [병점역, 서동탄역]

  - source: {line_no: I1101, name: 경인선}
    id: seoul-1-gyeongin
    name: 1호선 경인선
    city: 수도권
    color: "#0052A4"
    patch:
      # 원본은 구일부터 시작 → 분기점 구로와 연결
      prepend: ["구로역@I4101:경부선"]

  - source: {line_no: I4102, name: 경원선}
    id: seoul-1-gyeongwon
    name: 1호선 경원선
    city: 수도권
    color: "#0052A4"
    pools: ["I4102:경원선"]
    # 경원선 그룹의 용산~왕십리 역은 경의·중앙선 시퀀스에서 쓴다

  - source: {line_no: S1102, name: 수도권 도시철도 2호선}
    id: seoul-2
    name: 2호선
    city: 수도권
    color: "#00A84D"
    circular: true

  - source: {line_no: S1121, name: 수도권 도시철도 2호선}
    id: seoul-2-seongsu
    name: 2호선 성수지선
    city: 수도권
    color: "#00A84D"
    patch:
      prepend: ["성수@S1102:2호선"]

  - source: {line_no: S1122, name: 수도권 도시철도 2호선}
    id: seoul-2-sinjeong
    name: 2호선 신정지선
    city: 수도권
    color: "#00A84D"
    sequences:
      # 표준데이터에 2호선 까치산 행이 없어 5호선 까치산 역으로 잇는다
      - id: main
        stops: ["신도림@S1102:2호선", 도림천, 양천구청, 신정네거리, "까치산@S1105:5호선"]

  - source: {line_no: I1103, name: 수도권 광역철도 3호선}
    id: seoul-3
    name: 3호선
    city: 수도권
