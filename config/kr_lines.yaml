  - source: {line_no: I4104, name: 진접선}
    id: seoul-4-jinjeop
    name: 4호선 진접선
    city: 수도권
    color: "#00A5DE"
    patch:
      append: ["불암산@I1104:4호선"]

  - source: {line_no: I4103, name: 안산·과천선}
    id: seoul-4-ansan
    name: 4호선 안산·과천선
    city: 수도권
    color: "#00A5DE"
    patch:
      # 원본은 범계 다음에 산본 → 금정 누락. 시작점도 분기점 남태령과 연결
      insert_after: {범계역: [금정역]}
      prepend: ["남태령@I1104:4호선"]

  - source: {line_no: S1105, name: 수도권 도시철도 5호선}
    id: seoul-5
    name: 5호선
    city: 수도권
    color: "#996CAC"
    patch:
      # 원본은 하남검단산 뒤에 마천지선(P549~P555)을 이어 붙였다 → 지선 분리
      remove: [둔촌동, 올림픽공원(한국체대), 방이, 오금, 개롱, 거여, 마천]
    branches:
      - id: macheon
        stops: [강동, 둔촌동, 올림픽공원(한국체대), 방이, 오금, 개롱, 거여, 마천]

