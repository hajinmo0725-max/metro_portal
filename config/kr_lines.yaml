  - source: {line_no: I4108, name: 경의·중앙선}
    id: gyeongui-jungang
    name: 경의·중앙선
    city: 수도권
    color: "#77C4A3"
    pools: ["I4108:경의중앙선", "I4102:경원선"]
    # 경의중앙선 그룹의 광운대역 행은 일부 열차 종착 레코드로 보여 시퀀스에 넣지 않는다 (1호선 광운대와 환승 클러스터로 연결됨)
    # 원본은 용산~회기 누락, 가좌·효창공원앞 순서 꼬임, 서울역 지선 혼합 → 전체를 명시
    sequences:
      - id: main
        stops: [임진강역, 운천역, 문산역, 파주역, 월롱역, 금촌역, 금릉역, 운정역, 야당역, 탄현역, 일산역,
                풍산역, 백마역, 곡산역, 대곡역, 능곡역, 행신역, 강매역, 한국항공대, 수색역, 디지털미디어시티역,
                가좌역, 홍대입구역, 서강대역, 공덕역, 효창공원앞역,
                "용산역@I4102:경원선", "이촌역@I4102:경원선", "서빙고역@I4102:경원선", "한남역@I4102:경원선",
                "옥수역@I4102:경원선", "응봉역@I4102:경원선", "왕십리역@I4102:경원선",
                청량리역, 회기역, 중랑역, 상봉역, 망우역, 양원역, 구리역, 도농역, 양정역, 덕소역, 도심역, 팔당역,
                운길산역, 양수역, 신원역, 국수역, 아신역, 오빈역, 양평역, 원덕역, 용문역, 지평역]
      - id: seoul-station
        stops: [가좌역, 신촌역, 서울역(경의선)]

  - source: {line_no: I41K2, name: 경춘선}
