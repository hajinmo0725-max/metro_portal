# 3차 A6: 표준데이터(2026-06-30 기준)에 없는데 개통이 확인된 노선 보충. 데이터 큐레이션이지 매칭 룰이 아니다.
# 역 레코드는 레일포털 '전국 도시광역철도 역사정보'(다국어 파일, pipeline/01이 자동 수집)의 해당 행에서 만든다.
# 개통 확인 기준: 독립 근거 2개 이상 (다국어 파일 신설일자 + Wikidata P1619/P197). 확인 못 한 구간은 넣지 않고 not_added에 남긴다.
lines:
  - id: gtx-a
    line_no: XGTXA            # 표준데이터에 노선번호가 없어 가상 번호를 쓴다
    line_name: GTX-A
    name: GTX-A
    city: 수도권
    color: "#9A6292"          # 표시용. 공식 색상과 대조 안 함 (검증 못 함)
    match: {운영노선: GTX-A}   # 다국어 파일에서 이 조건의 행을 역으로 쓴다
    sequences:
      # 역번호 X101~X106 (X104 창릉은 미개통이라 행 없음). 다국어 파일 신설일자 2024-12-28, Wikidata P1619 2024-12-28(운정중앙·킨텍스)
      - id: north
        stops: [운정중앙, 킨텍스, 대곡, 연신내, 서울역]
        opened: "2024-12-28"
      # 역번호 X108~X111. 다국어 파일 신설일자 수서·성남 2024-03-29, 구성 2024-06-29. Wikidata 성남 P1619 2024-03-30, P197 성남–수서·성남–구성
      - id: south
        stops: [수서역, 성남역, 구성역, 동탄역]
        opened: "2024-03-30 (구성 2024-06-29)"
    not_added:
      - section: 서울역–(삼성 무정차)–수서
        reason: >-
          2026-05 보도는 '선로 연결 완료, 하반기 삼성역 무정차 개통 목표'(국토부 관계자). 2026-11-05 세션의 웹 검색에서 실제 개통을
          확인한 자료를 찾지 못했고, 다국어 파일(2026-07-01)·Wikidata에도 서울역–수서 인접 정보가 없다. 의심 목록으로 둔다.
      - section: 창릉(X104), 삼성(X107)
        reason: "미개통 (다국어 파일에 행 없음, 역번호 결번)"
# 다국어 파일 '환승노선명' 텍스트 → 표준데이터 환승노선번호 체계 코드. 보충 역의 공식 환승 정보로 쓴다 (metro_portal/transfer.py)
