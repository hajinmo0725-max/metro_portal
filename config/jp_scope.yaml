# 5차 T1: Phase 1b 도쿄권 범위. 데이터 범위 결정이지 매칭 룰이 아니다.
# 사용자 지시: JR 동일본 수도권 노선, 도쿄메트로, 도에이, 주요 사철. 소스는 Wikidata (CC0). ODPT는 4차 결정(Q6-9)대로 접근하지 않는다.
# 이름: 4차 Q6-1 '현지어 라벨 준공식' 규칙 — ja 라벨 = native_label, 공식명 P1448(ja) = official, en 라벨 = foreign_label.
country: JP
city: 도쿄권
# 수도권 범위 = 1도 3현 (역 아이템의 P131 사슬이 이 현에 닿는 역). 경계를 넘는 노선은 경계에서 자른다 (작성자 판단)
prefectures: {Q1490: 東京都, Q127513: 神奈川県, Q128186: 埼玉県, Q80011: 千葉県}
# 노선 아이템의 운영사(P137). '주요 사철' = 간토 대형 사철 8사 (작성자 판단: 준대형·제3섹터·모노레일·요코하마 시영 등 제외)
operators:
  Q499071: JR東日本
  Q682894: 東京メトロ
  Q1377135: 都営
  Q1321914: 東武
  Q83543: 西武
  Q83538: 京成
  Q80229029: 東急
  Q1322206: 京急
  Q83584: 小田急
  Q1332506: 京王
  Q845951: 相鉄
# JR은 Wikidata에 인프라 노선(東海道本線·東北本線 등) 단위로 걸려 있다. 신칸센·화물선·폐선 아이템은 뺀다
exclude_lines:
  Q1037409: 北陸新幹線
  Q900665: 東北新幹線
  Q912219: 上越新幹線
  Q11504243: 新金貨物線
  Q11526257: 東北貨物線
  Q11527983: 東海道貨物線
  Q11636387: 越中島支線 (화물)
  Q11582453: 相鉄厚木線 (화물)
  Q7862638: 東武熊谷線 (폐선)
  Q7862637: 東武啓志線 (폐선)
  Q11374627: 京王御陵線 (폐선)
  Q11374394: 京成白鬚線 (폐선)
  Q11374402: 京成谷津支線 (폐선)
  Q11077472: 西武安比奈線 (폐선)
  Q11643873: 都電志村線 (옛 노선)
  Q382338: 上野懸垂線 (휴지·폐지)
  Q11463101: 小田急向ヶ丘遊園モノレール線 (폐선)
  Q11374324: 京急武山線 (폐선)
# 범위 안 역이 이보다 적은 노선 아이템은 뺀다 (도쿄·우에노 같은 터미널 역 P81에 붙은 먼 노선 방어)
min_stations_in_scope: 2
# 역 사용 상태(P5817)가 이 값이면 뺀다 (폐역·계획·공사 중·휴지). 4차 survey_tokyo.py와 같은 목록
not_in_use_states: [Q811683, Q63065035, Q30108381, Q12377751, Q11639308, Q50376823]
as_of: "2026-11-09"
recent_since: "2025-01-01"
# P131이 없는 아이템 방어용 좌표 범위 (1도 3현 외접)
bbox: {lat_min: 34.85, lat_max: 36.35, lon_min: 138.9, lon_max: 140.95}
# 역번호: 노선 번호(예: JY01, G-09, KS 01)만 쓴다. 전보약호(ミウ, MI-U, URW)는 버린다
code_pattern: "^([A-Z]{1,3})[- ]?(\\d{1,3})([a-z]?)$"
# 인접역 거리 이상치 기준 (품질 리포트용)
adjacent_max_m: 8000
# 노선 색 기본값 (Wikidata P465가 없을 때)
default_color: "#888888"
# 라벨의 운영사 구분 접두어 (Wikidata가 같은 이름 역을 운영사별 아이템으로 나눌 때 붙인 것, 공식 역명이 아님). 표시·매칭 이름에서 뗀다.
# '京急蒲田·京成高砂·小田急相模原·東武練馬'처럼 공식 역명에 붙은 약칭(京急·京成·小田急·東武)은 떼지 않는다. 공식명(P1448)이 있으면 그걸 우선
label_prefix_pattern: "^(?:JR東日本|東京メトロ(?:[^線]{1,4}線)?|東京地下鉄|都営地下鉄|都営|京王電鉄\\s*(?:京王線)?|京浜急行電鉄|小田急電鉄|東急電鉄|東武鉄道|西武鉄道|相模鉄道|相鉄|京成電鉄)(?:・(?:東京メトロ|都営地下鉄|東急電鉄|横浜高速鉄道))*\\s*"
# 역이 아닌 시설(신호장·분기점·화물역). 역에서 빼고, 인접 사슬은 그 시설을 건너뛰어 잇는다
non_station_pattern: "(?:信号場|信号所|分岐点|貨物駅|貨物ターミナル駅?)(?:\\s*[(（].*[)）])?$"
# 역 이름 끝에서 뗄 접미사 (표시·매칭)
name_suffixes: ["駅", "停留場"]
