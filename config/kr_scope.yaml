# Phase 0 한국 스코프 조정. 기본은 "표준데이터 수록 범위 그대로"이고, 여기 적힌 것만 뺀다.
# pipeline/02_build_kr_stations.py가 읽는다. 빠진 역은 stations.json meta.excluded_by_scope에 남는다.
# 매칭 룰이 아니라 데이터 범위 결정이라 ruleset이 아닌 별도 파일에 둔다.
exclude_line_groups:
  - line_group: "S28M1:자기부상철도"
    reason: >-
      인천공항 자기부상철도. 2022년 7월 운행 중단 후 2025-10-17 운행을 재개했지만
      도시철도가 아닌 "체험형·공항이동지원형 궤도시설"로 전환됐다.
      공식 확인: 인천광역시 보도자료 2025-10-17 (docs/research/kr_line_openings.md 4-1장).
      Phase 0 스코프(도시철도·광역철도)에서 제외. 2026-11-05 결정, 2026-11-06 공식 확인.
