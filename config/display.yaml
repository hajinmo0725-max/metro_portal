# 5차 R2: 화면 표시용 역 이름 규칙. 매칭용 정규화(config/rulesets의 normalize)와 무관하다 — 포탈·클러스터 판정은 그대로.
# 4차 Q5에서 표시 이름의 '역' 접미사를 매칭 정규화와 같은 규칙으로 뗐다 (양평역 → 양평, 서울역 → 서울).
# 5차: '역'을 떼면 (a) 도시·지역 이름과 같아지거나 (b) 다른 역 이름과 겹치는 경우에는 화면에서 '역'을 유지한다 (사용자 지시).
keep_station_suffix:
  enabled: true
  suffix: "역"
  countries: [KR]
  # (a) 도시·지역 이름: 역 주소(표준데이터 소재지 주소) 앞 두 토큰 중 아래 접미사로 끝나는 행정구역 이름에서 접미사를 뗀 것.
  # 시·도·군까지만. 구(자치구: 강남·구로·동래 등)는 넣지 않는다 (작성자 판단, 넣으면 '역'이 붙는 클러스터가 크게 는다 → 보고서)
  region_suffixes: ["특별자치시", "특별자치도", "특별시", "광역시", "시", "도", "군"]
  region_min_length: 2
  # 주소 오기에서 나온 이름 (지역 이름이 아님)
  exclude_region_names: ["시승", "춘춘"]
  extra_region_names: []
  # (b) 다른 역 이름과 겹침: 같은 표시 이름(정규화 이름)의 다른 클러스터가 있고, 이 클러스터 역 레코드 중 하나라도 원래 이름에 '역'이 붙어 있으면 유지
  collision: true
