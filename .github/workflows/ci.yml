# PR·브랜치 푸시마다 파이프라인 테스트(pytest)와 웹 경로 로직 테스트(node)를 돌린다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # T2 이체자 테스트용 Unihan (data/raw는 커밋하지 않는다)
      - run: python pipeline/16_fetch_unihan.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
